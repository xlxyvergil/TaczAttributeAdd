name: Build & Release

# 鍙湁鎺ㄩ€?v* 鏍囩鎵嶄細鏋勫缓骞跺彂甯?Release锛涘垎鏀帹閫佷笉瑙﹀彂銆?
# 鎵嬪姩瑙﹀彂锛坵orkflow_dispatch锛夊彧鏋勫缓锛屼笉鍙戝竷銆?
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar_base: ${{ steps.ver.outputs.jar_base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve mod id and version
        id: ver
        run: |
          set -euo pipefail
          mod_id=$(grep -E '^mod_id=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mod_version=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          echo "jar_base=${mod_id}-${mod_version}+${mc_version}" >> "$GITHUB_OUTPUT"
          echo "resolved ${mod_id}-${mod_version}+${mc_version}"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Collect mod jars
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            ! -name '*-core.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          test -n "$(ls -A dist)" || { echo '::error::no mod jar produced by the build'; exit 1; }
          ls -l dist

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.jar_base }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download mod jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.jar_base }}
          path: dist

      - name: Verify tag matches gradle.properties
        id: meta
        run: |
          set -euo pipefail
          mod_version=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mod_name=$(grep -E '^mod_name=' gradle.properties | head -n1 | cut -d= -f2- | sed 's/[[:space:]]*$//')
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *"$mod_version"*) ;;
            *) echo "::error::鏍囩 $tag 涓?gradle.properties 鐨?mod_version=$mod_version 涓嶄竴鑷达紝鍏堟敼 mod_version 鍐嶆墦鏍囩"; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${mod_name} ${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag=${tag} title=${mod_name} ${tag} (mod_version=${mod_version}, mc=${mc_version})"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          title='${{ steps.meta.outputs.title }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - refreshing its assets"
            gh release upload "$tag" dist/*.jar --clobber
            exit 0
          fi

          # 鎵句笂涓€涓?tag 浣滀负 changelog 璧风偣锛涙壘涓嶅埌璇存槑鏄鍒嗘敮棣栧彂锛?
          # GitHub 鐨?--generate-notes 鍙細缁欎竴鏉?/commits/<tag> 鍏ㄩ噺閾炬帴锛屾墍浠ヨ嚜宸辨寜鎻愪氦绫诲瀷鏁寸悊銆?
          prev_tag=$(git describe --tags --abbrev=0 --exclude="$tag" 2>/dev/null || true)

          if [ -n "$prev_tag" ]; then
            echo "Generating changelog since $prev_tag"
            gh release create "$tag" dist/*.jar \
              --title "$title" \
              --notes-start-tag "$prev_tag" \
              --generate-notes
          else
            echo "First release on this branch - building changelog from the full commit history"
            {
              echo "## $title"
              echo
              echo "棣栧彂鏋勫缓锛氫互涓嬩负浠庡垵濮嬫彁浜ゅ埌 \`$tag\` 鐨勫叏閮ㄦ彁浜ゃ€?
              git log --no-merges --reverse --pretty=format:'%s%x1f%h' "$tag" \
                | awk -F'\037' '{ t=$1; h=$2; if (t ~ /^feat/) g="鏂板姛鑳?; else if (t ~ /^fix/) g="淇"; else if (t ~ /^refactor/) g="閲嶆瀯"; else if (t ~ /^docs/) g="鏂囨。"; else if (t ~ /^(ci|build|chore)/) g="鏋勫缓涓庣淮鎶?; else g="鍏朵粬"; items[g] = items[g] "- " t " (" h ")\n" } END { n = split("鏂板姛鑳絴淇|閲嶆瀯|鏂囨。|鏋勫缓涓庣淮鎶鍏朵粬", o, "|"); for (i = 1; i <= n; i++) { k = o[i]; if (k in items) { print ""; print "### " k; printf "%s", items[k] } } }'
              echo
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/commits/$tag"
            } > release-notes.md
            cat release-notes.md
            gh release create "$tag" dist/*.jar \
              --title "$title" \
              --notes-file release-notes.md
          fi
