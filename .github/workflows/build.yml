name: Build & Release

# 只有推送 v* 标签才会构建并发布 Release；分支推送不触发。
# 手动触发（workflow_dispatch）只构建，不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Collect mod jars
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            ! -name '*-core.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          test -n "$(ls -A dist)" || { echo '::error::no mod jar produced by the build'; exit 1; }
          ls -l dist

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download mod jar
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: dist

      - name: Verify tag matches gradle.properties
        id: meta
        run: |
          set -euo pipefail
          mod_version=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mod_name=$(grep -E '^mod_name=' gradle.properties | head -n1 | cut -d= -f2- | sed 's/[[:space:]]*$//')
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *"$mod_version"*) ;;
            *) echo "::error::标签 $tag 与 gradle.properties 的 mod_version=$mod_version 不一致，先改 mod_version 再打标签"; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${mod_name} ${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag=${tag} title=${mod_name} ${tag} (mod_version=${mod_version}, mc=${mc_version})"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          title='${{ steps.meta.outputs.title }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - refreshing its assets"
            gh release upload "$tag" dist/*.jar --clobber
          else
            echo "Creating release $tag"
            gh release create "$tag" dist/*.jar \
              --title "$title" \
              --generate-notes
          fi
