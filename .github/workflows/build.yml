name: Build & Release

# 只有推送 v* 标签才会构建并发布 Release；分支推送不触发。
# 手动触发（workflow_dispatch）只构建，不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar_base: ${{ steps.ver.outputs.jar_base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve mod id and version
        id: ver
        run: |
          set -euo pipefail
          mod_id=$(grep -E '^mod_id=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mod_version=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          echo "jar_base=${mod_id}-${mod_version}+${mc_version}" >> "$GITHUB_OUTPUT"
          echo "resolved ${mod_id}-${mod_version}+${mc_version}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Collect mod jars
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            ! -name '*-core.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          test -n "$(ls -A dist)" || { echo '::error::no mod jar produced by the build'; exit 1; }
          ls -l dist

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.jar_base }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download mod jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.jar_base }}
          path: dist

      - name: Verify tag matches gradle.properties
        id: meta
        run: |
          set -euo pipefail
          mod_version=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          mod_name=$(grep -E '^mod_name=' gradle.properties | head -n1 | cut -d= -f2- | sed 's/[[:space:]]*$//')
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *"$mod_version"*) ;;
            *) echo "::error::标签 $tag 与 gradle.properties 的 mod_version=$mod_version 不一致，先改 mod_version 再打标签"; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${mod_name} ${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag=${tag} title=${mod_name} ${tag} (mod_version=${mod_version}, mc=${mc_version})"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          title='${{ steps.meta.outputs.title }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - refreshing its assets"
            gh release upload "$tag" dist/*.jar --clobber
            exit 0
          fi

          # 找上一个 tag 作为 changelog 起点；找不到说明是该分支首发，
          # GitHub 的 --generate-notes 只会给一条 /commits/<tag> 全量链接，所以自己按提交类型整理。
          prev_tag=$(git describe --tags --abbrev=0 --exclude="$tag" 2>/dev/null || true)

          if [ -n "$prev_tag" ]; then
            echo "Generating changelog since $prev_tag"
            gh release create "$tag" dist/*.jar \
              --title "$title" \
              --notes-start-tag "$prev_tag" \
              --generate-notes
          else
            echo "First release on this branch - building changelog from the full commit history"
            {
              echo "## $title"
              echo
              echo "首发构建：以下为从初始提交到 \`$tag\` 的全部提交。"
              git log --no-merges --reverse --pretty=format:'%s%x1f%h' "$tag" \
                | awk -F'\037' '{ t=$1; h=$2; if (t ~ /^feat/) g="新功能"; else if (t ~ /^fix/) g="修复"; else if (t ~ /^refactor/) g="重构"; else if (t ~ /^docs/) g="文档"; else if (t ~ /^(ci|build|chore)/) g="构建与维护"; else g="其他"; items[g] = items[g] "- " t " (" h ")\n" } END { n = split("新功能|修复|重构|文档|构建与维护|其他", o, "|"); for (i = 1; i <= n; i++) { k = o[i]; if (k in items) { print ""; print "### " k; printf "%s", items[k] } } }'
              echo
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/commits/$tag"
            } > release-notes.md
            cat release-notes.md
            gh release create "$tag" dist/*.jar \
              --title "$title" \
              --notes-file release-notes.md
          fi
